name: macOS release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        env:
          OPENSSL_STATIC: '1'
        run: |
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          python -m pip install -r requirements-macos.txt reportlab==4.4.9
          npm install --no-save playwright
          npx playwright install chromium
          mkdir -p tmp
      - name: Regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          npm run check
          node tests/reader.test.cjs
      - name: Build native application
        run: python tools/build_macos.py
      - name: Verify and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/test_macos_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coursebook-macOS-${{ matrix.arch }}
          path: |
            release/macos/${{ matrix.arch }}/*.zip
            release/macos/${{ matrix.arch }}/*.json
            release/macos/${{ matrix.arch }}/*.txt
            release/macos/${{ matrix.arch }}/*.md
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macOS-diagnostics-${{ matrix.arch }}
          path: |
            tmp/macos-${{ matrix.arch }}/**/self-test-trace.log
            tmp/macos-${{ matrix.arch }}/**/startup-error.json
          if-no-files-found: ignore
